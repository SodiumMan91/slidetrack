<div id="app"></div>
<script>
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';
const TAB = { PROJECTS:'projects', EXP:'experiments', MICE:'mice', TISSUES:'tissues', SLIDES:'slides', LOG:'usage_log', INJ:'injections' };
const COLS = {
  PROJECTS:['id','name','description','color'],
  EXP:     ['id','projectId','name','description'],
  MICE:    ['id','expId','mouseNum','breederNo','gender','weightG','takedownAge','depleted','legacy','notes','dob', 'takedownDate'],
  TISSUES: ['id','mouseId','organ','tissueDate','sectioningDate','notes'],
  SLIDES:  ['id','tissueId','batch','slideNum','status','usedBy','usedFor','stainType','antibody','protocolVer','dateUsed','notes'],
  LOG:     ['timestamp','slideId','action','user','tissueId','batch','slideNum','details'],
  INJ:     ['id','mouseId','date','substance','weightBeforeG','notes'],
};

const PROJECT_COLORS = ['#3b5bdb','#1e6e3a','#b83232','#7a5000','#6e3aaa','#1a5fa8','#2d6a4f','#9d0208'];

const S = {
  view:'signin', tab:'inventory',
  user:null, isAdmin:false,
  currentProjectId: null,
  data:{ projects:[], experiments:[], mice:[], tissues:[], slides:[], usageLog:[], injections:[] },
  ui:{ expandedExps:{}, expandedMice:{}, expandedTissues:{} },
  filter:{ organ:'all', status:'all', search:'' },
  lookup:{ stainType:'all', antibody:'all' },
  loading:false, saving:false, error:null,
};

let gToken = null, tokenClient = null;

// ── Sheets API ────────────────────────────────────────────────────────────
async function sheetsReq(method, path, body) {
  const url = `${CONFIG.WORKER_URL}/sheets${path}`;
  const res = await fetch(url, {
    method,
    headers: {
      'X-Google-Token': gToken,
      'Content-Type': 'application/json',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Sheets ${res.status}: ${t.slice(0,200)}`); }
  return res.json();
}

async function readTab(tab) {
  try {
    const res = await sheetsReq('GET', `/values/${encodeURIComponent(tab)}`);
    return res.values || [];
  } catch(e) { console.warn('readTab', tab, e.message); return []; }
}

async function appendRow(tab, row) {
  await sheetsReq('POST', `/values/${encodeURIComponent(tab)}!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, { values:[row] });
}

async function updateSheetRow(tab, rowIdx, values) {
  const endCol = String.fromCharCode(64 + values.length);
  await sheetsReq('PUT', `/values/${encodeURIComponent(tab)}!A${rowIdx}:${endCol}${rowIdx}?valueInputOption=RAW`, { values:[values] });
}

async function deleteSheetRow(tab, rowIdx) {
  // Get the sheet metadata to find sheet id
  const meta = await sheetsReq('GET', '');
  const sheet = meta.sheets.find(s => s.properties.title === tab);
  if (!sheet) throw new Error('Sheet tab not found: ' + tab);
  const sheetId = sheet.properties.sheetId;
  await sheetsReq('POST', ':batchUpdate', {
    requests:[{
      deleteDimension:{
        range:{ sheetId, dimension:'ROWS', startIndex: rowIdx-1, endIndex: rowIdx }
      }
    }]
  });
}

function rowToObj(cols, row) {
  const o = {};
  cols.forEach((c,i) => { o[c] = row[i] !== undefined ? String(row[i]) : ''; });
  return o;
}

function objToRow(cols, obj) {
  return cols.map(c => obj[c] !== undefined ? String(obj[c]) : '');
}

async function getSpreadsheetMeta() {
  return sheetsReq('GET', '');
}

async function createSheetTab(tab) {
  await sheetsReq('POST', ':batchUpdate', {
    requests:[{ addSheet: { properties: { title: tab } } }]
  });
}

async function ensureHeaders() {
  const tabs = [
    [TAB.PROJECTS, COLS.PROJECTS],
    [TAB.EXP, COLS.EXP],
    [TAB.MICE, COLS.MICE],
    [TAB.TISSUES, COLS.TISSUES],
    [TAB.SLIDES, COLS.SLIDES],
    [TAB.LOG, COLS.LOG],
    [TAB.INJ, COLS.INJ],
  ];

  // Auto-create any tab that doesn't exist yet in the spreadsheet (e.g. a new
  // sheet added after the workbook was first set up, like 'tissues').
  let meta;
  try { meta = await getSpreadsheetMeta(); } catch(e) { meta = null; }
  const existingTitles = meta ? new Set(meta.sheets.map(s => s.properties.title)) : null;

  for (const [tab, cols] of tabs) {
    if (existingTitles && !existingTitles.has(tab)) {
      await createSheetTab(tab);
      existingTitles.add(tab);
    }
    const rows = await readTab(tab);
    if (rows.length === 0) { await appendRow(tab, cols); continue; }
    // Backward-compat: if a field was added to COLS since this sheet's header
    // row was created, extend the header row so new columns line up.
    const header = rows[0];
    if (header.length < cols.length) { await updateSheetRow(tab, 1, cols); }
  }
}

// Row index maps: tab → { id → rowIndex (1-based, accounting for header) }
const rowMaps = { projects:{}, experiments:{}, mice:{}, tissues:{}, slides:{}, injections:{} };

async function loadAllData() {
  await ensureHeaders();
  const [projRows, expRows, miceRows, tissueRows, slideRows, logRows, injRows] = await Promise.all([
    readTab(TAB.PROJECTS), readTab(TAB.EXP), readTab(TAB.MICE), readTab(TAB.TISSUES), readTab(TAB.SLIDES), readTab(TAB.LOG), readTab(TAB.INJ),
  ]);
  function parse(rows, cols, mapKey) {
    if (rows.length < 2) return [];
    const objs = rows.slice(1).filter(r => r && r[0]).map(r => rowToObj(cols, r));
    if (mapKey) {
      rowMaps[mapKey] = {};
      objs.forEach((o, i) => { rowMaps[mapKey][o.id] = i + 2; });
    }
    return objs;
  }
  const slides = parse(slideRows, COLS.SLIDES, 'slides').map(s => ({
    ...s,
    slideNum: parseInt(s.slideNum) || 0,
    batch: (s.batch===''||s.batch==='null') ? null : (isNaN(parseInt(s.batch)) ? null : parseInt(s.batch)),
  }));
  // rebuild slide rowMap
  rowMaps.slides = {};
  slides.forEach((sl, i) => { rowMaps.slides[sl.id] = i + 2; });

  return {
    projects: parse(projRows, COLS.PROJECTS, 'projects'),
    experiments: parse(expRows, COLS.EXP, 'experiments'),
    mice: parse(miceRows, COLS.MICE, 'mice'),
    tissues: parse(tissueRows, COLS.TISSUES, 'tissues'),
    slides,
    usageLog: parse(logRows, COLS.LOG),
    injections: parse(injRows, COLS.INJ, 'injections'),
  };
}

// ── Adjacency ─────────────────────────────────────────────────────────────
function computeAdjacency(slides) {
  const batches = [...new Set(slides.map(s => s.batch))];
  const parts = [];
  batches.forEach(bk => {
    const free = slides.filter(s => s.batch===bk && s.status==='free').sort((a,b)=>a.slideNum-b.slideNum);
    if (!free.length) return;
    let run = [free[0]];
    for (let i=1;i<free.length;i++) {
      if (free[i].slideNum === free[i-1].slideNum+1) run.push(free[i]);
      else { parts.push(runStr(run)); run=[free[i]]; }
    }
    parts.push(runStr(run));
  });
  return parts.length ? parts.join(' · ') : 'none free';
}
function runStr(run) {
  return run.length===1 ? '1' : `${run.length}adj(S${run[0].slideNum}-S${run[run.length-1].slideNum})`;
}

// ── Auth ──────────────────────────────────────────────────────────────────
function initTokenClient() {
  if (!window.google) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: SCOPES,
    prompt: 'select_account',
    callback: async (resp) => {
      if (resp.error) { S.error = 'Auth error: ' + resp.error; render(); return; }
      gToken = resp.access_token;
      let userEmail = '', userInfo = null;
      try {
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:`Bearer ${gToken}` } });
        userInfo = await r.json();
        userEmail = userInfo.email || '';
      } catch(e) {
        window.location.href = 'access-denied.html';
        return;
      }

      // Check allow-list + admin rights (lives server-side: the Worker reads
      // the lab's 'users' sheet via a service account). Fail closed: if this
      // check can't be completed, treat as not allowed.
      let isAdmin = false;
      try {
        const accessResp = await fetch(`${CONFIG.WORKER_URL}/check-access`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail }),
        });
        const access = await accessResp.json();
        if (!access.ok) {
          window.location.href = 'access-denied.html';
          return;
        }
        isAdmin = !!access.isAdmin;
      } catch(e) {
        window.location.href = 'access-denied.html';
        return;
      }

      S.isAdmin = isAdmin;
      S.user = { name: userInfo.name, email: userEmail, picture: userInfo.picture };
      S.view = 'app'; S.loading = true; render();
      try {
        S.data = await loadAllData();
        // Auto-select first project if only one
        if (!S.currentProjectId && S.data.projects.length === 1) {
          S.currentProjectId = S.data.projects[0].id;
        }
      } catch(e) { S.error = 'Could not load sheet: ' + e.message; }
      S.loading = false; render();
    },
  });
}

// ── Current project helpers ───────────────────────────────────────────────
function currentProject() {
  return S.data.projects.find(p => p.id === S.currentProjectId) || null;
}
function projectExperiments() {
  if (!S.currentProjectId) return S.data.experiments;
  return S.data.experiments.filter(e => e.projectId === S.currentProjectId);
}
function projectMice() {
  const exps = new Set(projectExperiments().map(e => e.id));
  return S.data.mice.filter(m => exps.has(m.expId));
}
function mouseTissues(mouseId) {
  return S.data.tissues.filter(t => t.mouseId === mouseId);
}
function projectTissues() {
  const miceIds = new Set(projectMice().map(m => m.id));
  return S.data.tissues.filter(t => miceIds.has(t.mouseId));
}
function tissueSlides(tissueId) {
  return S.data.slides.filter(s => s.tissueId === tissueId);
}
function projectSlides() {
  const tIds = new Set(projectTissues().map(t => t.id));
  return S.data.slides.filter(s => tIds.has(s.tissueId));
}
function tissueById(id) {
  return S.data.tissues.find(t => t.id === id);
}
function mouseInjections(mouseId) {
  return S.data.injections.filter(i => i.mouseId === mouseId)
    .sort((a,b) => (a.date||'').localeCompare(b.date||''));
}

function renderInventoryHTML() {

  const searchLower = search.toLowerCase();

    e.id.toLowerCase().includes(searchLower) ||
    (e.name||'').toLowerCase().includes(searchLower) ||
    mice.some(m=>m.expId===e.id && (m.id.toLowerCase().includes(searchLower) || mouseTissues(m.id).some(t=>(t.organ||'').toLowerCase().includes(searchLower))))

    const expTissueIds = new Set(expMice.flatMap(m=>mouseTissues(m.id).map(t=>t.id)));
    const expSlides = slides.filter(s=>expTissueIds.has(s.tissueId));
    if (status!=='all' && !expSlides.some(s=>s.status===status)) return;

// ── Lookup tab: browse/export by stain type + antibody ───────────────────
function lookupSlides() {
  // Pulls from ALL slides (not just current project) since the point is to
  // see every place a given stain/antibody combo has been used, lab-wide.
  // Only slides that have actually been stained (used or reserved) are relevant.
  return S.data.slides.filter(s => s.status === 'used' || s.status === 'reserved');
}

function renderLookupHTML() {
  const all = lookupSlides();
  const stainTypes = [...new Set(all.map(s => s.stainType).filter(Boolean))].sort();
  const antibodies = [...new Set(all.map(s => s.antibody).filter(Boolean))].sort();

  const { stainType, antibody } = S.lookup;
  let results = all;
  if (stainType !== 'all') results = results.filter(s => s.stainType === stainType);
  if (antibody !== 'all') results = results.filter(s => s.antibody === antibody);

  // newest first
  results = [...results].sort((a,b) => (b.dateUsed||'').localeCompare(a.dateUsed||''));

  const tissueByIdMap = Object.fromEntries(S.data.tissues.map(t => [t.id, t]));
  const mouseById = Object.fromEntries(S.data.mice.map(m => [m.id, m]));
  const expById = Object.fromEntries(S.data.experiments.map(e => [e.id, e]));

  const rowsHTML = results.map(sl => {
    const tissue = tissueByIdMap[sl.tissueId];
    const mouse = tissue ? mouseById[tissue.mouseId] : null;
    const exp = mouse ? expById[mouse.expId] : null;
    const batchLbl = sl.batch !== null ? 'B' + sl.batch : 'legacy';
    return `<tr>
      <td><span class="lookup-mouse-link" data-slide="${sl.id}">${mouse ? mouse.id : '—'}</span></td>
      <td>${exp ? exp.id + (exp.name ? ' — ' + exp.name : '') : '—'}</td>
      <td>${tissue?.organ || '—'}</td>
      <td>${batchLbl} · S${sl.slideNum}</td>
      <td>${sl.stainType || '—'}</td>
      <td>${sl.antibody || '—'}</td>
      <td>${sl.protocolVer || '—'}</td>
      <td><span class="pill pill-${sl.status}">${sl.status}</span></td>
      <td>${sl.dateUsed || '—'}</td>
      <td>${sl.usedBy || '—'}</td>
      <td>${sl.usedFor || sl.notes || ''}</td>
    </tr>`;
  }).join('');

  const table = results.length ? `
    <table class="lookup-table">
      <thead><tr>
        <th>Mouse</th><th>Experiment</th><th>Organ</th><th>Slide</th>
        <th>Stain</th><th>Antibody/Probe</th><th>Protocol</th><th>Status</th><th>Date</th><th>By</th><th>Notes</th>
      </tr></thead>
      <tbody>${rowsHTML}</tbody>
    </table>` : `<div class="empty">No stained slides match this combination yet.</div>`;

  return `
  <div class="lookup-row">
    <select id="lk-stain">
      <option value="all">All stain types</option>
      ${stainTypes.map(s=>`<option value="${s}" ${stainType===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <select id="lk-antibody">
      <option value="all">All antibodies/probes</option>
      ${antibodies.map(a=>`<option value="${a}" ${antibody===a?'selected':''}>${a}</option>`).join('')}
    </select>
    <button class="btn btn-sm" id="btn-lookup-download">${SVG.download} Download CSV</button>
  </div>
  <div class="lookup-summary">${results.length} slide${results.length===1?'':'s'} found${stainType!=='all'?' · '+stainType:''}${antibody!=='all'?' · '+antibody:''}</div>
  ${table}`;
}

function downloadLookupCSV() {
  const { stainType, antibody } = S.lookup;
  let results = lookupSlides();
  if (stainType !== 'all') results = results.filter(s => s.stainType === stainType);
  if (antibody !== 'all') results = results.filter(s => s.antibody === antibody);
  results = [...results].sort((a,b) => (b.dateUsed||'').localeCompare(a.dateUsed||''));

  const tissueByIdMap = Object.fromEntries(S.data.tissues.map(t => [t.id, t]));
  const mouseById = Object.fromEntries(S.data.mice.map(m => [m.id, m]));
  const expById = Object.fromEntries(S.data.experiments.map(e => [e.id, e]));

  const headers = ['mouseId','experiment','organ','batch','slideNum','stainType','antibody','protocolVer','status','dateUsed','usedBy','usedFor','notes'];
  const csvRows = [headers.join(',')];
  results.forEach(sl => {
    const tissue = tissueByIdMap[sl.tissueId];
    const mouse = tissue ? mouseById[tissue.mouseId] : null;
    const exp = mouse ? expById[mouse.expId] : null;
    const row = [
      mouse?mouse.id:'', exp?.id||'', tissue?.organ||'', sl.batch!==null?sl.batch:'legacy', sl.slideNum,
      sl.stainType||'', sl.antibody||'', sl.protocolVer||'', sl.status, sl.dateUsed||'', sl.usedBy||'',
      sl.usedFor||'', sl.notes||'',
    ];
    csvRows.push(row.map(csvEscape).join(','));
  });

  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const parts = ['slidetrack'];
  if (stainType !== 'all') parts.push(stainType);
  if (antibody !== 'all') parts.push(antibody);
  a.download = parts.join('_').replace(/[^a-z0-9_]+/gi,'_') + '.csv';
  a.click();
}

function csvEscape(val) {
  const s = String(val ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

// ── Export all records for one experiment ─────────────────────────────────
function doExportExperiment(exp) {
  const mice = S.data.mice.filter(m => m.expId === exp.id);
  const mouseIds = new Set(mice.map(m => m.id));
  const tissues = S.data.tissues.filter(t => mouseIds.has(t.mouseId));
  const tissueIds = new Set(tissues.map(t => t.id));
  const slides = S.data.slides.filter(s => tissueIds.has(s.tissueId));
  const injections = S.data.injections.filter(i => mouseIds.has(i.mouseId));
  const slideIds = new Set(slides.map(s => s.id));
  const logs = S.data.usageLog.filter(l => slideIds.has(l.slideId));

  const tissueByIdMap = Object.fromEntries(tissues.map(t => [t.id, t]));

  const sections = [];

  sections.push([`EXPERIMENT: ${exp.id}${exp.name ? ' — ' + exp.name : ''}`]);
  sections.push([]);

  sections.push(['MICE']);
  sections.push(['id','mouseNum','breederNo','gender','weightG','takedownAge','depleted','legacy','dob','notes']);
  mice.forEach(m => sections.push([m.id,m.mouseNum,m.breederNo,m.gender,m.weightG,m.takedownAge,m.depleted,m.legacy,m.dob,m.notes]));
  sections.push([]);

  sections.push(['TISSUES']);
  sections.push(['id','mouseId','organ','tissueDate','sectioningDate','notes']);
  tissues.forEach(t => sections.push([t.id,t.mouseId,t.organ,t.tissueDate,t.sectioningDate,t.notes]));
  sections.push([]);

  sections.push(['SLIDES']);
  sections.push(['id','mouseId','organ','tissueId','batch','slideNum','status','usedBy','stainType','antibody','protocolVer','dateUsed','usedFor','notes']);
  slides.forEach(s => {
    const t = tissueByIdMap[s.tissueId];
    sections.push([s.id, t?t.mouseId:'', t?t.organ:'', s.tissueId, s.batch!==null?s.batch:'legacy', s.slideNum, s.status, s.usedBy, s.stainType, s.antibody, s.protocolVer, s.dateUsed, s.usedFor, s.notes]);
  });
  sections.push([]);

  sections.push(['INJECTIONS']);
  sections.push(['id','mouseId','date','substance','weightBeforeG','notes']);
  injections.forEach(i => sections.push([i.id,i.mouseId,i.date,i.substance,i.weightBeforeG,i.notes]));
  sections.push([]);

  sections.push(['USAGE LOG']);
  sections.push(['timestamp','slideId','action','user','batch','slideNum','details']);
  logs.forEach(l => sections.push([l.timestamp,l.slideId,l.action,l.user,l.batch,l.slideNum,l.details]));

  const csv = sections.map(row => row.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `slidetrack_${exp.id}_export.csv`.replace(/[^a-z0-9_.]+/gi, '_');
  a.click();
}

function uniqueTissueId(mouseId, organ) {
  let base = `${mouseId}-${organ}`, id = base, n=2;
  while (S.data.tissues.some(t=>t.id===id)) { id = `${base}-${n}`; n++; }
  return id;
}

async function doSaveTissue(mouseId, existing) {
  const organ=document.getElementById('t-organ')?.value;
  if (!organ) { alert('Organ required'); return; }
  const tissueDate=document.getElementById('t-tissue-date')?.value||'';
  const sectioningDate=document.getElementById('t-section-date')?.value||'';
  const notes=document.getElementById('t-notes')?.value.trim();
  if (existing) {
    Object.assign(existing, { organ, tissueDate, sectioningDate, notes });
    closeModal(); render();
    const rowIdx = rowMaps.tissues[existing.id];
    if (rowIdx) await persist(async () => { await updateSheetRow(TAB.TISSUES, rowIdx, objToRow(COLS.TISSUES, existing)); });
  } else {
    const id = uniqueTissueId(mouseId, organ);
    const tissue = { id, mouseId, organ, tissueDate, sectioningDate, notes };
    S.data.tissues.push(tissue);
    S.ui.expandedMice[mouseId]=true;
    closeModal(); render();
    await persist(async () => { await appendRow(TAB.TISSUES, objToRow(COLS.TISSUES, tissue)); S.data = await loadAllData(); render(); });
  }
}

async function doDeleteTissue(tissueId) {
  const hasSlides = S.data.slides.some(s => s.tissueId === tissueId);
  if (hasSlides) { alert('Cannot delete: this tissue still has slides. Remove all its batches first.'); return; }
  if (!confirm('Delete this tissue/organ record?')) return;
  const rowIdx = rowMaps.tissues[tissueId];
  S.data.tissues = S.data.tissues.filter(t => t.id !== tissueId);
  closeModal(); render();
  if (rowIdx) await persist(async () => { await deleteSheetRow(TAB.TISSUES, rowIdx); S.data = await loadAllData(); render(); });
}

async function doAddBatch(presetTissueId) {
  let tissueId = presetTissueId || document.getElementById('b-tissue')?.value;
  const mouseId = document.getElementById('b-mouse')?.value
    || (presetTissueId ? (S.data.tissues.find(t=>t.id===presetTissueId)||{}).mouseId : null);
  if (!mouseId) { alert('Select a mouse'); return; }

  let newTissue = null;
  if (tissueId === '__new__') {
    const organ = document.getElementById('b-new-organ')?.value;
    if (!organ) { alert('Select an organ'); return; }
    newTissue = {
      id: uniqueTissueId(mouseId, organ), mouseId, organ,
      tissueDate: document.getElementById('b-new-tissue-date')?.value||'',
      sectioningDate: document.getElementById('b-new-section-date')?.value||'',
      notes:'',
    };
    tissueId = newTissue.id;
  }
  if (!tissueId) { alert('Select a tissue/organ'); return; }

  const batchRaw=document.getElementById('b-num')?.value.trim();
  const batch=batchRaw===''?null:parseInt(batchRaw);
  const count=parseInt(document.getElementById('b-count')?.value)||0;
  if (!count) { alert('Number of slides required'); return; }

  if (newTissue) S.data.tissues.push(newTissue);
  const existing=S.data.slides.filter(s=>s.tissueId===tissueId&&s.batch===batch);
  const startNum=existing.length+1;
  const newSlides=[];
  for (let i=0;i<count;i++) {
    const sl={ id:uid(), tissueId, batch:batch===null?'':String(batch), slideNum:startNum+i,
      status:'free', usedBy:'', usedFor:'', stainType:'', antibody:'', protocolVer:'', dateUsed:'', notes:'' };
    newSlides.push(sl);
    S.data.slides.push({...sl, batch, slideNum:startNum+i});
  }
  const mouse = S.data.mice.find(m=>m.id===mouseId);
  if (mouse) { S.ui.expandedExps[mouse.expId]=true; S.ui.expandedMice[mouse.id]=true; }
  S.ui.expandedTissues[tissueId]=true;
  closeModal(); render();
  await persist(async () => {
    if (newTissue) await appendRow(TAB.TISSUES, objToRow(COLS.TISSUES, newTissue));
    for (const sl of newSlides) await appendRow(TAB.SLIDES, objToRow(COLS.SLIDES, sl));
    S.data = await loadAllData(); render();
  });
}

const today = () => new Date().toISOString().split('T')[0];
const uid   = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);

async function persist(fn) {
  S.saving=true; render();
  try { await fn(); } catch(e) { S.error='Sheet sync error: '+e.message; }
  S.saving=false; render();
}

async function doAddProject() {
  const name = document.getElementById('np-name')?.value.trim();
  if (!name) { alert('Name required'); return; }
  const desc = document.getElementById('np-desc')?.value.trim();
  const selectedCol = document.querySelector('.color-pick[style*="var(--text)"]');
  const color = selectedCol ? selectedCol.dataset.col : PROJECT_COLORS[0];
  const id = uid();
  const proj = { id, name, description: desc, color };
  S.data.projects.push(proj);
  S.currentProjectId = id;
  closeModal(); render();
  await persist(async () => { await appendRow(TAB.PROJECTS, objToRow(COLS.PROJECTS, proj)); });
}

async function doEditProject(projId) {
  const proj = S.data.projects.find(p=>p.id===projId);
  if (!proj) return;
  const name = document.getElementById('np-name')?.value.trim();
  if (!name) { alert('Name required'); return; }
  proj.name = name;
  proj.description = document.getElementById('np-desc')?.value.trim();
  const selectedCol = document.querySelector('.color-pick[style*="var(--text)"]');
  if (selectedCol) proj.color = selectedCol.dataset.col;

  const rowIdx = rowMaps.projects[projId];

  if (!substance) { alert('Substance / compound required'); return; }

    Object.assign(existing, { date, substance, weightBeforeG, notes });
    closeModal(); render();
    const rowIdx = rowMaps.injections[existing.id];
    if (rowIdx) await persist(async () => { await updateSheetRow(TAB.INJ, rowIdx, objToRow(COLS.INJ, existing)); });
  } else {
    const inj = { id:uid(), mouseId, date, substance, weightBeforeG, notes };
    S.data.injections.push(inj);
    closeModal(); render();
    await persist(async () => { await appendRow(TAB.INJ, objToRow(COLS.INJ, inj)); S.data = await loadAllData(); render(); });
  }
}

async function doDeleteInjection(injId) {
  if (!confirm('Delete this injection record?')) return;
  const rowIdx = rowMaps.injections[injId];
  S.data.injections = S.data.injections.filter(i => i.id !== injId);
  closeModal(); render();
  if (rowIdx) await persist(async () => { await deleteSheetRow(TAB.INJ, rowIdx); S.data = await loadAllData(); render(); });
}

function makeLog(sl, action, user, details) {
  return { timestamp:today(), slideId:sl.id, action, user, tissueId:sl.tissueId,
    batch:sl.batch!==null?String(sl.batch):'legacy', slideNum:String(sl.slideNum),
    details:details.filter(Boolean).join(' · ') };
}

async function syncSlide(sl) {
  const rowIdx=rowMaps.slides[sl.id];
  if (!rowIdx) { console.warn('No row for', sl.id); return; }
  await updateSheetRow(TAB.SLIDES, rowIdx, objToRow(COLS.SLIDES, {...sl, batch:sl.batch!==null?String(sl.batch):'', slideNum:String(sl.slideNum)}));
}

async function doUse(sl) {
  const user=document.getElementById('a-user')?.value.trim();
  if (!user) { alert('Please enter your name'); return; }
  const stainType=document.getElementById('a-stain')?.value||sl.stainType;
  const antibody=document.getElementById('a-antibody')?.value||sl.antibody;
  const protocolVer=document.getElementById('a-protocol')?.value||sl.protocolVer;
  const usedFor=document.getElementById('a-notes')?.value||sl.usedFor;
  const dateUsed=document.getElementById('a-date')?.value||today();
  Object.assign(sl,{status:'used',usedBy:user,stainType,antibody,protocolVer,usedFor,dateUsed});
  const log=makeLog(sl,'used',user,[stainType,antibody,protocolVer,usedFor]);
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

async function doReserve(sl) {
  const user=document.getElementById('a-user')?.value.trim();
  if (!user) { alert('Please enter your name'); return; }
  const stainType=document.getElementById('a-stain')?.value;
  const antibody=document.getElementById('a-antibody')?.value;
  const protocolVer=document.getElementById('a-protocol')?.value;
  const usedFor=document.getElementById('a-notes')?.value;
  const dateUsed=document.getElementById('a-date')?.value||'';
  Object.assign(sl,{status:'reserved',usedBy:user,stainType,antibody,protocolVer,usedFor,dateUsed});
  const log=makeLog(sl,'reserved',user,[stainType,antibody,protocolVer,usedFor]);
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

async function doRelease(sl) {
  const user=document.getElementById('a-user')?.value.trim()||sl.usedBy;
  const log=makeLog(sl,'released',user,['Reservation released']);
  Object.assign(sl,{status:'free',usedBy:'',usedFor:'',stainType:'',antibody:'',protocolVer:'',dateUsed:'',notes:''});
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

// ── Remove use (mark free again) ────────────────────────────────────────
async function doRemoveUse(sl) {
  if (!confirm('Remove use record and mark slide as free again?')) return;
  const user = S.user?.name || 'admin';
  const log = makeLog(sl, 'removed', user, [`Removed use by ${sl.usedBy||'?'}`]);
  Object.assign(sl, {status:'free',usedBy:'',usedFor:'',stainType:'',antibody:'',protocolVer:'',dateUsed:'',notes:''});
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

// ── Edit use details ─────────────────────────────────────────────────────
async function doEditUse(sl) {
  const user=document.getElementById('a-user')?.value.trim();
  if (!user) { alert('Name required'); return; }
  const stainType=document.getElementById('a-stain')?.value||'';
  const antibody=document.getElementById('a-antibody')?.value||'';
  const protocolVer=document.getElementById('a-protocol')?.value||'';
  const usedFor=document.getElementById('a-notes')?.value||'';
  const dateUsed=document.getElementById('a-date')?.value||sl.dateUsed||'';
  Object.assign(sl,{usedBy:user,stainType,antibody,protocolVer,usedFor,dateUsed});
  const log=makeLog(sl,'edited',user,[stainType,antibody,protocolVer]);
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

// ── Mark missing ─────────────────────────────────────────────────────────
async function doMarkMissing(sl) {
  const user = S.user?.name || 'unknown';
  const log = makeLog(sl, 'missing', user, ['Slide marked missing']);
  Object.assign(sl,{status:'missing',notes:(sl.notes?sl.notes+'; ':'')+'Marked missing '+today()});
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

// ── Discard slide ────────────────────────────────────────────────────────
async function doDiscard(sl) {
  const reason = prompt('Reason for discarding (optional):') ?? '';
  const user = S.user?.name || 'unknown';
  const log = makeLog(sl, 'discarded', user, [reason || 'Discarded']);
  Object.assign(sl,{status:'discarded',notes:reason||'Discarded '+today()});
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

// ── Restore missing/discarded to free ────────────────────────────────────
async function doRestoreFree(sl) {
  if (!confirm('Restore this slide as free?')) return;
  const user = S.user?.name || 'unknown';
  const log = makeLog(sl, 'released', user, ['Restored to free from '+sl.status]);
  Object.assign(sl,{status:'free',usedBy:'',usedFor:'',stainType:'',antibody:'',protocolVer:'',dateUsed:'',notes:''});
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

// ── Export ────────────────────────────────────────────────────────────────
function doExport() {
  const dump=JSON.stringify(S.data,null,0);
  const b=new Blob([dump],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='slidetrack_dump.json'; a.click();
}

// ── Events ────────────────────────────────────────────────────────────────
function bindMain() {
  const on=(id,fn)=>document.getElementById(id)?.addEventListener('click',fn);
  on('btn-refresh', async()=>{
    S.loading=true; renderTab();
    try { S.data=await loadAllData(); } catch(e) { S.error=e.message; }
    S.loading=false; renderTab();
  });
  on('btn-export', doExport);
  on('btn-signout',()=>{ gToken=null;S.user=null;S.isAdmin=false;S.view='signin';render(); });
  on('btn-project-switch', modalProjects);
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{ S.tab=el.dataset.tab; render(); }));
}

function bindTab() {
  document.querySelectorAll('[data-exp]').forEach(el=>el.addEventListener('click', e=>{
    if (e.target.closest('[data-del-exp]') || e.target.closest('[data-edit-exp]') || e.target.closest('[data-export-exp]')) return;
    const id=el.dataset.exp; S.ui.expandedExps[id]=!S.ui.expandedExps[id];
    document.getElementById('tab-content').innerHTML=renderInventoryHTML(); bindTab();
  }));
  document.querySelectorAll('[data-del-exp]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    doDeleteExp(el.dataset.delExp);
  }));
  document.querySelectorAll('[data-edit-exp]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const exp = S.data.experiments.find(x=>x.id===el.dataset.editExp);
    if (exp) modalEditExp(exp);
  }));
  document.querySelectorAll('[data-export-exp]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const exp = S.data.experiments.find(x=>x.id===el.dataset.exportExp);
    if (exp) doExportExperiment(exp);
  }));
  document.querySelectorAll('[data-mouse]').forEach(el=>el.addEventListener('click',e=>{
    if (e.target.closest('[data-del-mouse]') || e.target.closest('[data-edit-mouse]')) return;
    const id=el.dataset.mouse; S.ui.expandedMice[id]=!S.ui.expandedMice[id];
    document.getElementById('tab-content').innerHTML=renderInventoryHTML(); bindTab();
  }));
  document.querySelectorAll('[data-del-mouse]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    doDeleteMouse(el.dataset.delMouse);
  }));
  document.querySelectorAll('[data-edit-mouse]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const mouse = S.data.mice.find(x=>x.id===el.dataset.editMouse);
    if (mouse) modalEditMouse(mouse);
  }));
  document.querySelectorAll('[data-tissue]').forEach(el=>el.addEventListener('click', e=>{
    if (e.target.closest('[data-del-tissue]') || e.target.closest('[data-edit-tissue]')) return;
    const id=el.dataset.tissue; S.ui.expandedTissues[id]=!S.ui.expandedTissues[id];
    document.getElementById('tab-content').innerHTML=renderInventoryHTML(); bindTab();
  }));
  document.querySelectorAll('[data-del-tissue]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    doDeleteTissue(el.dataset.delTissue);
  }));
  document.querySelectorAll('[data-edit-tissue]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const tissue = S.data.tissues.find(x=>x.id===el.dataset.editTissue);
    if (tissue) modalAddTissue(tissue.mouseId, tissue);
  }));
  document.querySelectorAll('[data-add-tissue]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    modalAddTissue(el.dataset.addTissue, null);
  }));
  document.querySelectorAll('[data-add-batch-tissue]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    modalAddBatch(el.dataset.addBatchTissue);
  }));
  document.querySelectorAll('[data-slide]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();
    const sl=S.data.slides.find(s=>s.id===el.dataset.slide);
    if(sl) modalSlide(sl);
  }));
  document.querySelectorAll('[data-add-injection]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    modalInjection(el.dataset.addInjection, null);
  }));
  document.querySelectorAll('[data-edit-inj]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const inj = S.data.injections.find(i=>i.id===el.dataset.editInj);
    if (inj) modalInjection(el.dataset.injMouse, inj);
  }));
  document.querySelectorAll('[data-del-inj]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    doDeleteInjection(el.dataset.delInj);
  }));
  const refilter=()=>{ document.getElementById('tab-content').innerHTML=renderInventoryHTML(); bindTab(); };
  document.getElementById('flt-search')?.addEventListener('input',e=>{ S.filter.search=e.target.value; refilter(); });
  document.getElementById('flt-organ')?.addEventListener('change',e=>{ S.filter.organ=e.target.value; refilter(); });
  document.getElementById('flt-status')?.addEventListener('change',e=>{ S.filter.status=e.target.value; refilter(); });
  document.getElementById('btn-add-exp')?.addEventListener('click', modalAddExp);
  document.getElementById('btn-add-mouse')?.addEventListener('click', modalAddMouse);
  document.getElementById('btn-add-batch')?.addEventListener('click', ()=>modalAddBatch());

  // Lookup tab
  const relookup=()=>{ document.getElementById('tab-content').innerHTML=renderLookupHTML(); bindTab(); };
  document.getElementById('lk-stain')?.addEventListener('change',e=>{ S.lookup.stainType=e.target.value; relookup(); });
  document.getElementById('lk-antibody')?.addEventListener('change',e=>{ S.lookup.antibody=e.target.value; relookup(); });
  document.getElementById('btn-lookup-download')?.addEventListener('click', downloadLookupCSV);
  document.querySelectorAll('.lookup-mouse-link[data-slide]').forEach(el=>el.addEventListener('click',()=>{
    const sl=S.data.slides.find(s=>s.id===el.dataset.slide);
    if(sl) modalSlide(sl);
  }));
}

// ── Boot ──────────────────────────────────────────────────────────────────
if (window.location.hash) history.replaceState(null,'',window.location.pathname+window.location.search);
window.addEventListener('load',()=>{ if(window.google) initTokenClient(); });
render();
</script>
