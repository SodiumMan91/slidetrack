<body>
<div id="app"></div>
<script>
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';
const TAB = { EXP:'experiments', MICE:'mice', SLIDES:'slides', LOG:'usage_log' };
const COLS = {
  EXP:   ['id','name','description'],
  MICE:  ['id','expId','mouseNum','organ','breederNo','gender','weightG','takedownAge','tissueDate','sectioningDate','depleted','legacy','notes'],
  SLIDES:['id','mouseId','batch','slideNum','status','usedBy','usedFor','stainType','antibody','protocolVer','dateUsed','notes'],
  LOG:   ['timestamp','slideId','action','user','mouseId','batch','slideNum','details'],
};

const S = {
  view:'signin', tab:'inventory',
  user:null, isAdmin:false,
  data:{ experiments:[], mice:[], slides:[], usageLog:[] },
  ui:{ expandedExps:{}, expandedMice:{} },
  filter:{ organ:'all', status:'all', search:'' },
  loading:false, saving:false, error:null,
  slideRowMap:{},
};

let gToken = null, tokenClient = null;

// ── Sheets API ────────────────────────────────────────────────────────────
async function sheetsReq(method, path, body) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}${path}`;
  const res = await fetch(url, {
    method,
    headers:{ Authorization:`Bearer ${gToken}`, 'Content-Type':'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`Sheets ${res.status}: ${t.slice(0,200)}`); }
  return res.json();
}

async function readTab(tab) {
  try {
    const res = await sheetsReq('GET', `/values/${encodeURIComponent(tab)}`);
    return res.values || [];
  } catch(e) { console.warn('readTab', tab, e.message); return []; }
}

async function appendRow(tab, row) {
  await sheetsReq('POST', `/values/${encodeURIComponent(tab)}!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, { values:[row] });
}

async function updateSheetRow(tab, rowIdx, values) {
  const endCol = String.fromCharCode(64 + values.length);
  await sheetsReq('PUT', `/values/${encodeURIComponent(tab)}!A${rowIdx}:${endCol}${rowIdx}?valueInputOption=RAW`, { values:[values] });
}

function rowToObj(cols, row) {
  const o = {};
  cols.forEach((c,i) => { o[c] = row[i] !== undefined ? String(row[i]) : ''; });
  return o;
}

function objToRow(cols, obj) {
  return cols.map(c => obj[c] !== undefined ? String(obj[c]) : '');
}

async function ensureHeaders() {
  for (const [tab, cols] of [[TAB.EXP,COLS.EXP],[TAB.MICE,COLS.MICE],[TAB.SLIDES,COLS.SLIDES],[TAB.LOG,COLS.LOG]]) {
    const rows = await readTab(tab);
    if (rows.length === 0) await appendRow(tab, cols);
  }
}

async function loadAllData() {
  await ensureHeaders();
  const [expRows, miceRows, slideRows, logRows] = await Promise.all([
    readTab(TAB.EXP), readTab(TAB.MICE), readTab(TAB.SLIDES), readTab(TAB.LOG),
  ]);
  function parse(rows, cols) {
    if (rows.length < 2) return [];
    return rows.slice(1).filter(r => r && r[0]).map(r => rowToObj(cols, r));
  }
  const slides = parse(slideRows, COLS.SLIDES).map(s => ({
    ...s,
    slideNum: parseInt(s.slideNum) || 0,
    batch: (s.batch===''||s.batch==='null') ? null : (isNaN(parseInt(s.batch)) ? null : parseInt(s.batch)),
  }));
  S.slideRowMap = {};
  slides.forEach((sl, i) => { S.slideRowMap[sl.id] = i + 2; });
  return { experiments: parse(expRows, COLS.EXP), mice: parse(miceRows, COLS.MICE), slides, usageLog: parse(logRows, COLS.LOG) };
}

// ── Adjacency ─────────────────────────────────────────────────────────────
function computeAdjacency(slides) {
  const batches = [...new Set(slides.map(s => s.batch))];
  const parts = [];
  batches.forEach(bk => {
    const free = slides.filter(s => s.batch===bk && s.status==='free').sort((a,b)=>a.slideNum-b.slideNum);
    if (!free.length) return;
    let run = [free[0]];
    for (let i=1;i<free.length;i++) {
      if (free[i].slideNum === free[i-1].slideNum+1) run.push(free[i]);
      else { parts.push(runStr(run)); run=[free[i]]; }
    }
    parts.push(runStr(run));
  });
  return parts.length ? parts.join(' · ') : 'none free';
}
function runStr(run) {
  return run.length===1 ? '1' : `${run.length}adj(S${run[0].slideNum}-S${run[run.length-1].slideNum})`;
}

// ── Auth ──────────────────────────────────────────────────────────────────
function initTokenClient() {
  if (!window.google) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: SCOPES,
    prompt: 'select_account',
    callback: async (resp) => {
      if (resp.error) { S.error = 'Auth error: ' + resp.error; render(); return; }
      gToken = resp.access_token;
      try {
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:`Bearer ${gToken}` } });
        const info = await r.json();
        S.user = { name: info.name, email: info.email, picture: info.picture };
      } catch(e) { S.user = { name:'Lab member', email:'', picture:'' }; }
      S.view = 'app'; S.loading = true; render();
      try { S.data = await loadAllData(); } catch(e) { S.error = 'Could not load sheet: ' + e.message; }
      S.loading = false; render();
    },
  });
}

// ── SVG icons ─────────────────────────────────────────────────────────────
const SVG = {
  chevron:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  lock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  unlock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>`,
  download:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  refresh:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  logout:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
};

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  if (S.view === 'signin') { renderSignin(); return; }
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="logo">SlideTrack <sub>Lab Slide Inventory</sub></div>
      <div class="topbar-r">
        ${S.saving ? `<span class="saving">Saving…</span>` : ''}
        ${S.user ? `<div class="user-chip">${S.user.picture?`<img src="${S.user.picture}">`:''}${S.user.name||S.user.email}</div>` : ''}
        <button class="btn btn-sm" id="btn-refresh">${SVG.refresh} Refresh</button>
        <button class="btn btn-sm" id="btn-admin">${S.isAdmin?SVG.unlock:SVG.lock} ${S.isAdmin?'Admin on':'Admin'}</button>
        <button class="btn btn-sm" id="btn-export">${SVG.download} Export</button>
        <button class="btn btn-sm btn-danger" id="btn-signout">${SVG.logout}</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${S.tab==='inventory'?'active':''}" data-tab="inventory">Inventory</div>
      <div class="tab ${S.tab==='log'?'active':''}" data-tab="log">Usage log</div>
    </div>
    <div id="tab-content"></div>
    <div id="modal-area"></div>`;
  renderTab();
  bindMain();
}

function renderSignin() {
  document.getElementById('app').innerHTML = `
  <div class="setup-wrap"><div class="setup-card">
    <h2>SlideTrack</h2>
    <p>Sign in with your Google account to access the lab slide inventory.</p>
    <button class="btn btn-primary" id="btn-gsignin" style="width:100%;justify-content:center;padding:10px;font-size:14px">Sign in with Google</button>
    <div id="signin-err"></div>
    <div class="divider"></div>
    <p style="font-size:12px;color:var(--text3)">Data lives in your lab's Google Sheet. No other servers involved.</p>
  </div></div>`;
  document.getElementById('btn-gsignin').addEventListener('click', () => {
    if (!window.google) { document.getElementById('signin-err').innerHTML=`<div class="err-box" style="margin-top:1rem">Google auth failed to load.</div>`; return; }
    if (!tokenClient) initTokenClient();
    tokenClient.requestAccessToken();
  });
}

function renderTab() {
  const el = document.getElementById('tab-content');
  if (!el) return;
  if (S.loading) { el.innerHTML=`<div class="loader"><div class="spinner"></div> Loading from Google Sheets…</div>`; return; }
  let html = '';
  if (S.error) html += `<div class="err-box"><strong>Error:</strong> ${S.error} <button class="btn btn-sm" id="btn-dismiss">Dismiss</button></div>`;
  html += S.tab==='inventory' ? renderInventoryHTML() : renderLogHTML();
  el.innerHTML = html;
  document.getElementById('btn-dismiss')?.addEventListener('click', ()=>{ S.error=null; renderTab(); });
  bindTab();
}

function renderInventoryHTML() {
  const {experiments, mice, slides} = S.data;
  const {organ, status, search} = S.filter;
  const totalFree = slides.filter(s=>s.status==='free').length;
  const totalRes  = slides.filter(s=>s.status==='reserved').length;
  const totalUsed = slides.filter(s=>s.status==='used').length;
  const organs = [...new Set(mice.map(m=>m.organ))].filter(Boolean);

  let exps = experiments;
  if (search) exps = exps.filter(e =>
    e.id.toLowerCase().includes(search.toLowerCase()) ||
    (e.name||'').toLowerCase().includes(search.toLowerCase()) ||
    mice.some(m=>m.expId===e.id && m.id.toLowerCase().includes(search.toLowerCase()))
  );
  if (organ !== 'all') exps = exps.filter(e => mice.some(m=>m.expId===e.id && m.organ===organ));

  let expHTML = '';
  exps.forEach(exp => {
    const expMice = mice.filter(m=>m.expId===exp.id);
    const expSlides = slides.filter(s=>expMice.some(m=>m.id===s.mouseId));
    if (status!=='all' && !expSlides.some(s=>s.status===status)) return;
    const eFree=expSlides.filter(s=>s.status==='free').length;
    const eRes=expSlides.filter(s=>s.status==='reserved').length;
    const eUsed=expSlides.filter(s=>s.status==='used').length;
    const isOpen = S.ui.expandedExps[exp.id];

    let miceHTML = '';
    expMice.forEach(mouse => {
      if (organ!=='all' && mouse.organ!==organ) return;
      const mSlides = slides.filter(s=>s.mouseId===mouse.id);
      if (status!=='all' && !mSlides.some(s=>s.status===status)) return;
      const mFree=mSlides.filter(s=>s.status==='free').length;
      const mRes=mSlides.filter(s=>s.status==='reserved').length;
      const mUsed=mSlides.filter(s=>s.status==='used').length;
      const adj = computeAdjacency(mSlides);
      const isMOpen = S.ui.expandedMice[mouse.id];

      const batches = [...new Set(mSlides.map(s=>s.batch))].sort((a,b)=>a===null?-1:b===null?1:a-b);
      let batchHTML = '';
      batches.forEach(bk => {
        const bSlides = mSlides.filter(s=>s.batch===bk).sort((a,b)=>a.slideNum-b.slideNum);
        const lbl = bk===null ? 'Legacy (no batch)' : `Batch ${bk}`;
        const btns = bSlides.map(sl => {
          const cls = sl.status==='free'?'slide-free':sl.status==='reserved'?'slide-reserved':'slide-used';
          const tip = sl.status==='free'?'Free — click to use or reserve'
            :sl.status==='reserved'?`Reserved: ${sl.usedBy||'?'} · ${sl.antibody||sl.usedFor||''}`
            :`Used: ${sl.usedBy||'?'} · ${sl.antibody||''} ${sl.dateUsed||''}`;
          return `<button class="slide-btn ${cls}" data-slide="${sl.id}" title="${tip}">${sl.slideNum}</button>`;
        }).join('');
        batchHTML += `<div class="batch-block"><div class="batch-label">${lbl}</div><div class="slides-row">${btns}</div></div>`;
      });

      const meta = [mouse.gender, mouse.weightG?mouse.weightG+'g':'', mouse.takedownAge,
        mouse.tissueDate?'Tissue:'+mouse.tissueDate:'', mouse.breederNo?'Breeder:'+mouse.breederNo:''].filter(Boolean).join(' · ');

      miceHTML += `<div class="mouse-block">
        <div class="mouse-header" data-mouse="${mouse.id}">
          <div>
            <div class="mouse-id">${mouse.id}</div>
            <div class="mouse-meta">${meta}</div>
            <div class="mouse-badges">
              <span class="badge b-organ">${mouse.organ}</span>
              ${mouse.depleted==='true'?`<span class="badge b-depleted">Depleted</span>`:''}
              ${mouse.legacy==='true'?`<span class="badge b-legacy">Legacy</span>`:''}
            </div>
          </div>
          <div style="text-align:right">
            <div class="mouse-stats">Free:${mFree} Res:${mRes} Used:${mUsed}</div>
            ${isMOpen?`<div class="adj-line">${adj}</div>`:''}
          </div>
        </div>
        ${isMOpen?`<div class="mouse-body">${batchHTML}${mouse.notes?`<div style="font-size:11px;color:var(--text2);margin-top:6px">${mouse.notes}</div>`:''}</div>`:''}
      </div>`;
    });

    expHTML += `<div class="exp-block">
      <div class="exp-header" data-exp="${exp.id}">
        <div>
          <div class="exp-title">${exp.id}${exp.name?' — '+exp.name:''}</div>
          ${exp.description?`<div class="exp-desc">${exp.description}</div>`:''}
          <div style="font-size:11px;color:var(--text3);margin-top:3px">Free:${eFree} · Res:${eRes} · Used:${eUsed} · Mice:${expMice.length}</div>
        </div>
        <span class="exp-chevron ${isOpen?'open':''}">${SVG.chevron}</span>
      </div>
      ${isOpen?`<div class="exp-body">${miceHTML||'<div class="empty" style="padding:1.5rem">No mice yet.</div>'}</div>`:''}
    </div>`;
  });

  if (!expHTML) expHTML = `<div class="empty">No experiments found. ${S.isAdmin?'Add one above.':'Ask an admin to add experiments.'}</div>`;

  return `
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" style="color:var(--green)">${totalFree}</div><div class="stat-lbl">Free blanks</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--amber)">${totalRes}</div><div class="stat-lbl">Reserved</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--text3)">${totalUsed}</div><div class="stat-lbl">Used</div></div>
    <div class="stat-card"><div class="stat-val">${experiments.length}</div><div class="stat-lbl">Experiments</div></div>
    <div class="stat-card"><div class="stat-val">${mice.length}</div><div class="stat-lbl">Mice</div></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="leg-dot leg-free"></div>Free</div>
    <div class="legend-item"><div class="leg-dot leg-res"></div>Reserved</div>
    <div class="legend-item"><div class="leg-dot leg-used"></div>Used</div>
  </div>
  <div class="filters">
    <input id="flt-search" placeholder="Search…" value="${search}" style="width:200px"/>
    <select id="flt-organ"><option value="all">All organs</option>${organs.map(o=>`<option value="${o}" ${organ===o?'selected':''}>${o}</option>`).join('')}</select>
    <select id="flt-status">
      <option value="all" ${status==='all'?'selected':''}>All status</option>
      <option value="free" ${status==='free'?'selected':''}>Free only</option>
      <option value="reserved" ${status==='reserved'?'selected':''}>Reserved</option>
      <option value="used" ${status==='used'?'selected':''}>Used</option>
    </select>
    ${S.isAdmin?`<button class="btn btn-sm btn-primary" id="btn-add-exp">${SVG.plus} Experiment</button>`:''}
    ${S.isAdmin?`<button class="btn btn-sm" id="btn-add-mouse">${SVG.plus} Mouse</button>`:''}
    ${S.isAdmin?`<button class="btn btn-sm" id="btn-add-batch">${SVG.plus} Batch</button>`:''}
  </div>
  ${expHTML}`;
}

function renderLogHTML() {
  const log = [...S.data.usageLog].reverse();
  if (!log.length) return `<div class="empty">No usage history yet.</div>`;
  return `<div>`+log.map(l=>{
    const cls=l.action==='used'?'log-used':l.action==='reserved'?'log-reserved':'log-released';
    const icon=l.action==='used'?'●':l.action==='reserved'?'◐':'○';
    return `<div class="log-item">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-family:var(--mono);font-size:12px">${l.mouseId||'?'} · ${l.batch?'B'+l.batch:'legacy'} · S${l.slideNum||'?'}</span>
        <span style="font-size:11px;color:var(--text3)">${l.timestamp}</span>
      </div>
      <div style="margin-top:2px;font-size:13px">
        <span class="${cls}" style="font-weight:700">${icon} ${l.action}</span>
        <span style="color:var(--text2)"> by <strong>${l.user||'?'}</strong>${l.details?' — '+l.details:''}</span>
      </div>
    </div>`;
  }).join('')+'</div>';
}

  const ref = `${sl.mouseId} · ${sl.batch!==null?'Batch '+sl.batch:'Legacy'} · Slide ${sl.slideNum}`;
  const isFree = sl.status==='free', isReserved = sl.status==='reserved';

    sl.protocolVer?['Protocol ver.',sl.protocolVer]:null,
    sl.usedFor?['Purpose',sl.usedFor]:null,
    sl.dateUsed?['Date used',sl.dateUsed]:null,
    sl.notes?['Notes',sl.notes]:null,
  ].filter(Boolean).map(([l,v])=>`<div class="detail-row"><span class="detail-lbl">${l}</span><span>${v}</span></div>`).join('');

  const form = isFree ? `
    ${protocolDatalist()}

    <div class="form-2col">

    </div>
    <div class="form-row"><label>Antibody / Probe</label><input id="a-antibody" list="antibody-list" placeholder="e.g. Hmgcs2"/></div>
    <div class="form-row"><label>Purpose / notes</label><textarea id="a-notes" placeholder="What staining run is this for?"></textarea></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn" id="btn-reserve">Reserve</button>
      <button class="btn btn-primary" id="btn-use">Mark used</button>
    </div>` :
  isReserved ? `
    <div class="form-row"><label>Your name</label><input id="a-user" value="${sl.usedBy||S.user?.name||''}"/></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Cancel</button>

}

// ── Mutations ─────────────────────────────────────────────────────────────
const today = () => new Date().toISOString().split('T')[0];
const uid   = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);

async function persist(fn) {
  S.saving=true; render();
  try { await fn(); } catch(e) { S.error='Sheet sync error: '+e.message; }
  S.saving=false; render();
}

async function doAddExp() {
  const id = document.getElementById('e-id')?.value.trim();
  if (!id) { alert('ID required'); return; }
  if (S.data.experiments.find(e=>e.id===id)) { alert('ID already exists'); return; }
  const exp = { id, name:document.getElementById('e-name')?.value.trim(), description:document.getElementById('e-desc')?.value.trim() };
  S.data.experiments.push(exp);
  closeModal(); render();
  await persist(async () => { await appendRow(TAB.EXP, objToRow(COLS.EXP, exp)); });
}

async function doAddMouse() {
  const expId=document.getElementById('m-exp')?.value;
  const num=document.getElementById('m-num')?.value.trim();
  const organ=document.getElementById('m-organ')?.value;
  if (!num) { alert('Mouse number required'); return; }
  const mouseId=`${expId}#${num}-${organ}`;
  if (S.data.mice.find(m=>m.id===mouseId)) { alert(`${mouseId} already exists`); return; }
  const mouse = {
    id:mouseId, expId, mouseNum:num, organ,
    breederNo:document.getElementById('m-breeder')?.value.trim(),
    gender:document.getElementById('m-gender')?.value,
    weightG:document.getElementById('m-weight')?.value.trim(),
    takedownAge:document.getElementById('m-age')?.value.trim(),
    tissueDate:document.getElementById('m-tissue')?.value,
    sectioningDate:document.getElementById('m-section')?.value,
    depleted:document.getElementById('m-depleted')?.checked?'true':'false',
    legacy:document.getElementById('m-legacy')?.checked?'true':'false',
    notes:document.getElementById('m-notes')?.value.trim(),
  };
  S.data.mice.push(mouse);
  S.ui.expandedExps[expId]=true;
  closeModal(); render();
  await persist(async () => { await appendRow(TAB.MICE, objToRow(COLS.MICE, mouse)); });
}

async function doAddBatch() {
  const mouseId=document.getElementById('b-mouse')?.value;
  const batchRaw=document.getElementById('b-num')?.value.trim();
  const batch=batchRaw===''?null:parseInt(batchRaw);
  const count=parseInt(document.getElementById('b-count')?.value)||0;
  if (!count) { alert('Number of slides required'); return; }
  const existing=S.data.slides.filter(s=>s.mouseId===mouseId&&s.batch===batch);
  const startNum=existing.length+1;
  const newSlides=[];
  for (let i=0;i<count;i++) {
    const sl={ id:uid(), mouseId, batch:batch===null?'':String(batch), slideNum:startNum+i,
      status:'free', usedBy:'', usedFor:'', stainType:'', antibody:'', protocolVer:'', dateUsed:'', notes:'' };
    newSlides.push(sl);
    S.data.slides.push({...sl, batch});
  }
  const mouse=S.data.mice.find(m=>m.id===mouseId);
  if (mouse) { S.ui.expandedExps[mouse.expId]=true; S.ui.expandedMice[mouseId]=true; }
  closeModal(); render();
  await persist(async () => {
    for (const sl of newSlides) await appendRow(TAB.SLIDES, objToRow(COLS.SLIDES, sl));
    // Reload to get accurate row map for future edits
    S.data = await loadAllData();
    render();
  });
}

function makeLog(sl, action, user, details) {
  return { timestamp:today(), slideId:sl.id, action, user, mouseId:sl.mouseId,
    batch:sl.batch!==null?String(sl.batch):'legacy', slideNum:String(sl.slideNum),
    details:details.filter(Boolean).join(' · ') };
}

async function syncSlide(sl) {
  const rowIdx=S.slideRowMap[sl.id];
  if (!rowIdx) { console.warn('No row for', sl.id); return; }
  await updateSheetRow(TAB.SLIDES, rowIdx, objToRow(COLS.SLIDES, {...sl, batch:sl.batch!==null?String(sl.batch):'', slideNum:String(sl.slideNum)}));
}

async function doUse(sl) {
  const user=document.getElementById('a-user')?.value.trim();
  if (!user) { alert('Please enter your name'); return; }
  const stainType=document.getElementById('a-stain')?.value||sl.stainType;
  const antibody=document.getElementById('a-antibody')?.value||sl.antibody;
  const protocolVer=document.getElementById('a-protocol')?.value||sl.protocolVer;
  const usedFor=document.getElementById('a-notes')?.value||sl.usedFor;
  Object.assign(sl,{status:'used',usedBy:user,stainType,antibody,protocolVer,usedFor,dateUsed:today()});
  const log=makeLog(sl,'used',user,[stainType,antibody,protocolVer,usedFor]);
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

async function doReserve(sl) {
  const user=document.getElementById('a-user')?.value.trim();
  if (!user) { alert('Please enter your name'); return; }
  const stainType=document.getElementById('a-stain')?.value;
  const antibody=document.getElementById('a-antibody')?.value;
  const protocolVer=document.getElementById('a-protocol')?.value;
  const usedFor=document.getElementById('a-notes')?.value;
  Object.assign(sl,{status:'reserved',usedBy:user,stainType,antibody,protocolVer,usedFor});
  const log=makeLog(sl,'reserved',user,[stainType,antibody,protocolVer,usedFor]);
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

async function doRelease(sl) {
  const user=document.getElementById('a-user')?.value.trim()||sl.usedBy;
  const log=makeLog(sl,'released',user,['Reservation released']);
  Object.assign(sl,{status:'free',usedBy:'',usedFor:'',stainType:'',antibody:'',protocolVer:'',dateUsed:'',notes:''});
  S.data.usageLog.push(log);
  closeModal(); render();
  await persist(async()=>{ await syncSlide(sl); await appendRow(TAB.LOG, objToRow(COLS.LOG, log)); });
}

        meta=' '.join(filter(None,[mouse.get('gender',''),mouse.get('weightG','')+'g' if mouse.get('weightG') else '',mouse.get('takedownAge',''),'Breeder:'+mouse.get('breederNo','') if mouse.get('breederNo') else '']))
        print(f"\\n  MOUSE: {mouse['id']}{'  ['+', '.join(flags)+']' if flags else ''}  |  {meta}")
        print(f"  Tissue:{mouse.get('tissueDate','—')}  Sectioned:{mouse.get('sectioningDate','—')}")
        for b in sorted(set(s['batch'] for s in msl),key=lambda x:(x in('','null',None),x)):
            bsl=sorted([s for s in msl if s['batch']==b],key=lambda x:int(x['slideNum']))
            print(f"    [{'legacy' if b in ('','null',None) else 'Batch '+str(b)}]")
            for s in bsl:
                info=''
                if s['status']!='free':
                    info='  →  '+' '.join(filter(None,[s.get('usedBy'),s.get('stainType'),s.get('antibody'),s.get('protocolVer'),s.get('dateUsed')]))
                print(f"      Slide {int(s['slideNum']):3d}  [{s['status'].upper():8s}]{info}")
print("\\n"+"="*72+"\\nUSAGE LOG (newest first)\\n"+"="*72)
for l in reversed(db.get('usageLog',[])):
    print(f"  {l.get('timestamp',''):12}  {l.get('mouseId','?'):22}  B{l.get('batch','?'):3}  S{l.get('slideNum','?'):3}  {l.get('action','').upper():8}  {l.get('user','?'):14}  {l.get('details','')}")
`;
  [['dump.json',dump],['pretty_print.py',script]].forEach(([name,content])=>{
    const b=new Blob([content],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=name;a.click();
  });
}

// ── Events ────────────────────────────────────────────────────────────────
function bindMain() {
  const on=(id,fn)=>document.getElementById(id)?.addEventListener('click',fn);
  on('btn-refresh', async()=>{
    S.loading=true; renderTab();
    try { S.data=await loadAllData(); } catch(e) { S.error=e.message; }
    S.loading=false; renderTab();
  });
  on('btn-admin',()=>{ S.isAdmin?(S.isAdmin=false,render()):modalPin(); });
  on('btn-export', doExport);
  on('btn-signout',()=>{ gToken=null;S.user=null;S.isAdmin=false;S.view='signin';render(); });
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{ S.tab=el.dataset.tab; render(); }));
}

function bindTab() {
  document.querySelectorAll('[data-exp]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.exp; S.ui.expandedExps[id]=!S.ui.expandedExps[id];
    document.getElementById('tab-content').innerHTML=renderInventoryHTML(); bindTab();
  }));
  document.querySelectorAll('[data-mouse]').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.mouse; S.ui.expandedMice[id]=!S.ui.expandedMice[id];
    document.getElementById('tab-content').innerHTML=renderInventoryHTML(); bindTab();
  }));
  document.querySelectorAll('[data-slide]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();
    const sl=S.data.slides.find(s=>s.id===el.dataset.slide);
    if(sl) modalSlide(sl);
  }));
  const refilter=()=>{ document.getElementById('tab-content').innerHTML=renderInventoryHTML(); bindTab(); };
  document.getElementById('flt-search')?.addEventListener('input',e=>{ S.filter.search=e.target.value; refilter(); });
  document.getElementById('flt-organ')?.addEventListener('change',e=>{ S.filter.organ=e.target.value; refilter(); });
  document.getElementById('flt-status')?.addEventListener('change',e=>{ S.filter.status=e.target.value; refilter(); });
  document.getElementById('btn-add-exp')?.addEventListener('click', modalAddExp);
  document.getElementById('btn-add-mouse')?.addEventListener('click', modalAddMouse);
  document.getElementById('btn-add-batch')?.addEventListener('click', modalAddBatch);
}

// ── Boot ──────────────────────────────────────────────────────────────────
if (window.location.hash) history.replaceState(null,'',window.location.pathname+window.location.search);
window.addEventListener('load',()=>{ if(window.google) initTokenClient(); });
render();
</script>
