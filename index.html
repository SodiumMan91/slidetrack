<script>
// ── Sheets API helpers ──────────────────────────────────────────────────
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';
const DISCOVERY = 'https://sheets.googleapis.com/v4/spreadsheets';

// Sheet tab names — these will be auto-created on first run
const TAB = {
  EXPERIMENTS: 'experiments',
  SLIDES: 'slides',
  LOG: 'usage_log',
};

let gToken = null; // OAuth access token

async function sheetsReq(method, path, body) {
  if (!gToken) throw new Error('Not signed in');
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}${path}`;
  const res = await fetch(url, {
    method,
    headers: { Authorization: `Bearer ${gToken}`, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`Sheets API error ${res.status}: ${err}`);
  }
  return res.json();
}

async function readSheet(tab) {
  const res = await sheetsReq('GET', `/values/${encodeURIComponent(tab)}`);
  return res.values || [];
}

async function appendRow(tab, row) {
  await sheetsReq('POST', `/values/${encodeURIComponent(tab)}!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
    values: [row],
  });
}

async function updateCell(tab, row1, col1, value) {
  // row1 and col1 are 1-indexed
  const colLetter = String.fromCharCode(64 + col1);
  const range = `${tab}!${colLetter}${row1}`;
  await sheetsReq('PUT', `/values/${encodeURIComponent(range)}?valueInputOption=RAW`, {
    values: [[value]],
  });
}

async function updateRow(tab, row1, values) {
  const endCol = String.fromCharCode(64 + values.length);
  const range = `${tab}!A${row1}:${endCol}${row1}`;
  await sheetsReq('PUT', `/values/${encodeURIComponent(range)}?valueInputOption=RAW`, {
    values: [values],
  });
}

// ── Data model ──────────────────────────────────────────────────────────
// experiments: [id, name, organ, takedown_age, tissue_date, staining_plan, depleted, legacy, sectioning_requested_date, notes]
// slides:      [id, exp_id, batch, slide_num, status, used_by, used_for, stain_type, antibody, protocol_ver, date_used, notes]
// usage_log:   [timestamp, slide_id, action, user, exp_id, batch, slide_num, details]

const EXP_COLS = ['id','name','organ','takedownAge','tissueDate','stainingPlan','depleted','legacy','sectioningDate','notes'];
const SLIDE_COLS = ['id','expId','batch','slideNum','status','usedBy','usedFor','stainType','antibody','protocolVer','dateUsed','notes'];
const LOG_COLS = ['timestamp','slideId','action','user','expId','batch','slideNum','details'];

function rowToObj(headers, row) {
  const obj = {};
  headers.forEach((h, i) => { obj[h] = row[i] !== undefined ? row[i] : ''; });
  return obj;
}

function objToRow(headers, obj) {
  return headers.map(h => obj[h] !== undefined ? String(obj[h]) : '');
}

async function ensureHeaders() {
  // Write header rows if sheet tabs are empty
  for (const [tab, cols] of [[TAB.EXPERIMENTS, EXP_COLS],[TAB.SLIDES, SLIDE_COLS],[TAB.LOG, LOG_COLS]]) {
    try {
      const rows = await readSheet(tab);
      if (rows.length === 0) {
        await sheetsReq('POST', `/values/${encodeURIComponent(tab)}!A1:append?valueInputOption=RAW`, {
          values: [cols],
        });
      }
    } catch(e) {
      // Tab may not exist — user needs to create it manually
      console.warn('Tab issue:', tab, e.message);
    }
  }
}

async function loadData() {
  const [expRows, slideRows, logRows] = await Promise.all([
    readSheet(TAB.EXPERIMENTS),
    readSheet(TAB.SLIDES),
    readSheet(TAB.LOG),
  ]);

  const parseRows = (rows, cols) => {
    if (rows.length < 2) return [];
    return rows.slice(1).filter(r => r[0]).map(r => rowToObj(cols, r));
  };

  return {
    experiments: parseRows(expRows, EXP_COLS),
    slides: parseRows(slideRows, SLIDE_COLS).map(s => ({...s, slideNum: parseInt(s.slideNum)||0, batch: s.batch===''||s.batch==='null' ? null : (isNaN(parseInt(s.batch)) ? s.batch : parseInt(s.batch))})),
    usageLog: parseRows(logRows, LOG_COLS),
  };
}

// ── State ───────────────────────────────────────────────────────────────
const S = {
  view: 'signin',   // 'signin' | 'app'
  tab: 'inventory',
  user: null,       // { name, email, picture }
  isAdmin: false,
  data: { experiments: [], slides: [], usageLog: [] },
  modal: null,
  selectedSlide: null,
  filter: { organ: 'all', status: 'all', search: '' },
  loading: false,
  saving: false,
  error: null,
  slideRowMap: {},  // slideId -> 1-indexed row in sheet
};

// ── Adjacency ────────────────────────────────────────────────────────────
function computeAdjacency(slides, expId) {
  const expSlides = slides.filter(s => s.expId === expId);
  const batches = [...new Set(expSlides.map(s => s.batch))];
  const parts = [];
  batches.forEach(bk => {
    const bslides = expSlides
      .filter(s => s.batch === bk && s.status === 'free')
      .sort((a, b) => a.slideNum - b.slideNum);
    if (!bslides.length) return;
    let run = [bslides[0].slideNum];
    for (let i = 1; i < bslides.length; i++) {
      if (bslides[i].slideNum === bslides[i-1].slideNum + 1) {
        run.push(bslides[i].slideNum);
      } else {
        parts.push(run.length === 1 ? '1' : run.length + 'adj(S'+run[0]+'-S'+run[run.length-1]+')');
        run = [bslides[i].slideNum];
      }
    }
    parts.push(run.length === 1 ? '1' : run.length + 'adj(S'+run[0]+'-S'+run[run.length-1]+')');
  });
  return parts.length ? parts.join(' · ') : 'none free';
}

// ── Render helpers ───────────────────────────────────────────────────────
const h = (tag, attrs, ...children) => {
  const el = document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v]) => {
    if (k === 'cls') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.forEach(c => {
    if (c == null) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
};

function setHTML(id, html) {
  const el = document.getElementById(id) || document.getElementById('app');
  el.innerHTML = html;
}

// ── SVG icons ────────────────────────────────────────────────────────────
const icon = {
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  unlock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  refresh: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  logout: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
};

// ── Main render ──────────────────────────────────────────────────────────
function render() {
  const root = document.getElementById('app');

  if (S.view === 'signin') { renderSignin(); return; }

  root.innerHTML = `
  <div id="main-wrap">
    <div class="topbar">
      <div class="logo">SlideTrack <sub>Lab Slide Inventory</sub></div>
      <div class="topbar-right">
        ${S.saving ? `<span class="saving-indicator">Saving…</span>` : ''}

let tokenClient = null;
let pendingUserInfo = null;

function initTokenClient() {
  if (!window.google) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: SCOPES,
    prompt: 'select_account',
    callback: async (tokenResponse) => {
      if (tokenResponse.error) {
        S.error = 'Auth error: ' + tokenResponse.error;
        render();
        return;
      }
      gToken = tokenResponse.access_token;

      // Get user info from Google
      try {
        const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: `Bearer ${gToken}` }
        });
        const info = await res.json();
        S.user = { name: info.name, email: info.email, picture: info.picture };
      } catch(e) {
        S.user = { name: 'Lab member', email: '', picture: '' };
      }

      S.view = 'app';
      S.loading = true;
      render();
      loadData().then(data => {
        S.data = data;
        S.loading = false;
        buildSlideRowMap();
        render();
      }).catch(e => {
        S.loading = false;
        S.error = 'Could not load sheet: ' + e.message;
        render();
      });
    },
  });
}

function buildSlideRowMap() {
  // Maps slideId -> 1-indexed sheet row (row 1 = header)
  S.slideRowMap = {};
  S.data.slides.forEach((sl, i) => {
    S.slideRowMap[sl.id] = i + 2; // +1 for header, +1 for 1-indexing
  });
}

function renderTab() {
  const el = document.getElementById('tab-content');
  if (!el) return;
  if (S.loading) { el.innerHTML = `<div class="loader"><div class="spinner"></div> Loading from Google Sheets…</div>`; return; }
  if (S.error) { el.innerHTML = `<div class="err-box"><strong>Error:</strong> ${S.error} <button class="btn btn-sm" onclick="S.error=null;render()">Dismiss</button></div>`; }

}

function renderInventoryHTML() {
  const { experiments, slides } = S.data;
  const { organ, status, search } = S.filter;

  let exps = experiments;
  if (organ !== 'all') exps = exps.filter(e => e.organ === organ);
  if (search) exps = exps.filter(e =>
    e.id.toLowerCase().includes(search.toLowerCase()) ||
    e.name.toLowerCase().includes(search.toLowerCase())
  );

  const allSlides = slides;
  const totalFree = allSlides.filter(s=>s.status==='free').length;
  const totalRes  = allSlides.filter(s=>s.status==='reserved').length;
  const totalUsed = allSlides.filter(s=>s.status==='used').length;
  const organs = [...new Set(experiments.map(e=>e.organ))];

  let expCards = '';
  exps.forEach(exp => {
    const expSlides = slides.filter(s => s.expId === exp.id);
    if (status !== 'all' && !expSlides.some(s=>s.status===status)) return;

    const sFree = expSlides.filter(s=>s.status==='free').length;
    const sRes  = expSlides.filter(s=>s.status==='reserved').length;
    const sUsed = expSlides.filter(s=>s.status==='used').length;
    const adj = computeAdjacency(expSlides, exp.id);

    const batches = [...new Set(expSlides.map(s=>s.batch))]
      .sort((a,b) => a===null ? -1 : b===null ? 1 : a-b);

    let batchHTML = '';
    batches.forEach(bk => {
      const bslides = expSlides
        .filter(s => s.batch === bk)
        .sort((a,b) => a.slideNum - b.slideNum);
      const label = bk === null ? 'Legacy (no batch)' : `Batch ${bk}`;
      let btns = bslides.map(sl => {
        const cls = sl.status==='free' ? 'slide-free' : sl.status==='reserved' ? 'slide-reserved' : 'slide-used';
        const tip = sl.status==='free' ? 'Free — click to use or reserve'
          : sl.status==='reserved' ? `Reserved by ${sl.usedBy||'?'} for ${sl.antibody||sl.usedFor||'?'}`
          : `Used by ${sl.usedBy||'?'} — ${sl.antibody||sl.stainType||''} ${sl.dateUsed||''}`;
        return `<button class="slide-btn ${cls}" data-slide="${sl.id}" title="${tip}">${sl.slideNum}</button>`;
      }).join('');
      batchHTML += `<div class="batch-block"><div class="batch-label">${label}</div><div class="slides-row">${btns}</div></div>`;
    });

    expCards += `<div class="exp-card">
      <div class="exp-header">
        <div>
          <div class="exp-id">${exp.id}</div>
          <div class="exp-name">${exp.name||''}</div>
          <div class="exp-meta">Tissue: ${exp.tissueDate||'—'} · Age: ${exp.takedownAge||'—'}${exp.sectioningDate?' · Sectioned: '+exp.sectioningDate:''}</div>
          <div class="badges">
            <span class="badge badge-organ">${exp.organ}</span>
            ${exp.depleted==='true'||exp.depleted===true ? `<span class="badge badge-depleted">Depleted</span>` : ''}
            ${exp.legacy==='true'||exp.legacy===true ? `<span class="badge badge-legacy">Legacy</span>` : ''}
          </div>
          <div class="adj-line">Free: ${sFree} · Reserved: ${sRes} · Used: ${sUsed} · Adj: ${adj}</div>
        </div>
        <div style="font-size:11px;color:var(--c-text-3);max-width:180px;text-align:right;line-height:1.5">${exp.stainingPlan||''}<br>${exp.notes||''}</div>
      </div>
      ${batchHTML}
    </div>`;
  });

  if (!expCards) expCards = `<div class="empty">No experiments match your filters. ${S.isAdmin ? 'Add one with the button above.' : 'Ask an admin to add experiments.'}</div>`;

  return `
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" style="color:var(--c-green)">${totalFree}</div><div class="stat-lbl">Free blanks</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--c-amber)">${totalRes}</div><div class="stat-lbl">Reserved</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--c-text-3)">${totalUsed}</div><div class="stat-lbl">Used</div></div>
    <div class="stat-card"><div class="stat-val">${experiments.length}</div><div class="stat-lbl">Experiments</div></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="leg-dot leg-free"></div>Free</div>
    <div class="legend-item"><div class="leg-dot leg-res"></div>Reserved</div>
    <div class="legend-item"><div class="leg-dot leg-used"></div>Used</div>
  </div>
  <div class="filters">
    <input id="flt-search" placeholder="Search…" value="${search}" style="width:160px"/>
    <select id="flt-organ">
      <option value="all">All organs</option>
      ${organs.map(o=>`<option value="${o}" ${organ===o?'selected':''}>${o}</option>`).join('')}
    </select>
    <select id="flt-status">
      <option value="all" ${status==='all'?'selected':''}>All status</option>
      <option value="free" ${status==='free'?'selected':''}>Free only</option>
      <option value="reserved" ${status==='reserved'?'selected':''}>Reserved</option>
      <option value="used" ${status==='used'?'selected':''}>Used</option>
    </select>
    ${S.isAdmin ? `<button class="btn btn-sm btn-primary" id="btn-add-exp">${icon.plus} Experiment</button>` : ''}
    ${S.isAdmin ? `<button class="btn btn-sm" id="btn-add-batch">${icon.plus} Batch / slides</button>` : ''}
  </div>
  ${expCards}`;
}

function renderLogHTML() {
  const log = [...S.data.usageLog].reverse();

// ── Data mutations ────────────────────────────────────────────────────────
function today() { return new Date().toISOString().split('T')[0]; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

async function doAddExp() {
  const id = document.getElementById('ae-id')?.value.trim();
  if (!id) { alert('Experiment ID is required'); return; }
  const exp = {
    id,
    name: document.getElementById('ae-name')?.value.trim(),
    organ: document.getElementById('ae-organ')?.value,
    takedownAge: document.getElementById('ae-age')?.value.trim(),
    tissueDate: document.getElementById('ae-tissue-date')?.value,
    stainingPlan: document.getElementById('ae-stain')?.value.trim(),
    depleted: document.getElementById('ae-depleted')?.checked ? 'true' : 'false',
    legacy: document.getElementById('ae-legacy')?.checked ? 'true' : 'false',
    sectioningDate: document.getElementById('ae-sec-date')?.value,
    notes: document.getElementById('ae-notes')?.value.trim(),
  };
  S.data.experiments.push(exp);
  closeModal(); render();
  await saveRow(TAB.EXPERIMENTS, EXP_COLS, exp);
}

async function doAddBatch() {
  const expId = document.getElementById('ab-exp')?.value;
  const batchRaw = document.getElementById('ab-batch')?.value.trim();
  const batch = batchRaw === '' ? null : parseInt(batchRaw);
  const count = parseInt(document.getElementById('ab-count')?.value) || 0;
  if (!count) { alert('Number of slides is required'); return; }

  const existing = S.data.slides.filter(s => s.expId === expId && s.batch === batch);
  const startNum = existing.length + 1;
  const newSlides = [];
  for (let i = 0; i < count; i++) {
    const sl = {
      id: uid(), expId, batch: batch === null ? '' : batch,
      slideNum: startNum + i, status: 'free',
      usedBy: '', usedFor: '', stainType: '', antibody: '', protocolVer: '', dateUsed: '', notes: '',
    };
    newSlides.push(sl);
    S.data.slides.push({...sl, batch});
  }
  buildSlideRowMap();
  closeModal(); render();

  S.saving = true;
  try {
    for (const sl of newSlides) await saveRow(TAB.SLIDES, SLIDE_COLS, sl);
  } catch(e) { S.error = 'Failed to save to sheet: ' + e.message; }
  S.saving = false; render();
}

async function doUseSlide(sl) {
  const user = document.getElementById('act-user')?.value.trim();
  if (!user) { alert('Please enter your name'); return; }
  const stainType = document.getElementById('act-stain')?.value || sl.stainType;
  const antibody = document.getElementById('act-antibody')?.value || sl.antibody;
  const protocolVer = document.getElementById('act-protocol')?.value || sl.protocolVer;
  const usedFor = document.getElementById('act-notes')?.value || sl.usedFor;
  const dateUsed = today();

  Object.assign(sl, { status:'used', usedBy:user, stainType, antibody, protocolVer, usedFor, dateUsed });

  const logEntry = {
    timestamp: dateUsed, slideId: sl.id, action: 'used', user,
    expId: sl.expId, batch: sl.batch!==null ? sl.batch : 'legacy',
    slideNum: sl.slideNum, details: [stainType, antibody, protocolVer, usedFor].filter(Boolean).join(' · '),
  };
  S.data.usageLog.push(logEntry);
  closeModal(); render();
  await persistSlideAndLog(sl, logEntry);
}

async function doReserveSlide(sl) {
  const user = document.getElementById('act-user')?.value.trim();
  if (!user) { alert('Please enter your name'); return; }
  const stainType = document.getElementById('act-stain')?.value;
  const antibody = document.getElementById('act-antibody')?.value;
  const protocolVer = document.getElementById('act-protocol')?.value;
  const usedFor = document.getElementById('act-notes')?.value;

  Object.assign(sl, { status:'reserved', usedBy:user, stainType, antibody, protocolVer, usedFor });

  const logEntry = {
    timestamp: today(), slideId: sl.id, action: 'reserved', user,
    expId: sl.expId, batch: sl.batch!==null ? sl.batch : 'legacy',
    slideNum: sl.slideNum, details: [stainType, antibody, protocolVer, usedFor].filter(Boolean).join(' · '),
  };
  S.data.usageLog.push(logEntry);
  closeModal(); render();
  await persistSlideAndLog(sl, logEntry);
}

async function doReleaseSlide(sl) {
  const user = document.getElementById('act-user')?.value.trim() || sl.usedBy;
  Object.assign(sl, { status:'free', usedBy:'', usedFor:'', stainType:'', antibody:'', protocolVer:'', dateUsed:'', notes:'' });

  const logEntry = {
    timestamp: today(), slideId: sl.id, action: 'released', user,
    expId: sl.expId, batch: sl.batch!==null ? sl.batch : 'legacy',
    slideNum: sl.slideNum, details: 'Reservation released',
  };
  S.data.usageLog.push(logEntry);
  closeModal(); render();
  await persistSlideAndLog(sl, logEntry);
}

async function persistSlideAndLog(sl, logEntry) {
  S.saving = true; render();
  try {
    const rowIdx = S.slideRowMap[sl.id];
    if (rowIdx) {
      await updateRow(TAB.SLIDES, rowIdx, objToRow(SLIDE_COLS, {
        ...sl, batch: sl.batch !== null ? sl.batch : '',
      }));
    }
    await saveRow(TAB.LOG, LOG_COLS, logEntry);
  } catch(e) {
    S.error = 'Sheet sync failed: ' + e.message + '. Local state updated but sheet may be out of sync.';
  }
  S.saving = false; render();
}

async function saveRow(tab, cols, obj) {
  const row = objToRow(cols, obj);
  await appendRow(tab, row);
}

function doExport() {

  const script = `#!/usr/bin/env python3

with open(sys.argv[1]) as f:
    db = json.load(f)

exps  = {e['id']: e for e in db['experiments']}

// ── Event binding ─────────────────────────────────────────────────────────
function bindMain() {
  const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);
  on('btn-refresh', async () => {
    S.loading = true; renderTab();
    S.data = await loadData(); buildSlideRowMap();
    S.loading = false; renderTab();
  });
  on('btn-admin', () => { if (S.isAdmin) { S.isAdmin = false; render(); } else modalAdminPin(); });
  on('btn-export', doExport);
  on('btn-signout', () => { gToken = null; S.user = null; S.isAdmin = false; S.view = 'signin'; render(); });
  document.querySelectorAll('[data-tab]').forEach(el =>
    el.addEventListener('click', () => { S.tab = el.dataset.tab; renderTab(); bindMain(); })
  );
}

function bindTab() {
  document.querySelectorAll('[data-slide]').forEach(el =>
    el.addEventListener('click', () => {
      const sl = S.data.slides.find(s => s.id === el.dataset.slide);
      if (sl) { S.selectedSlide = sl; modalSlideAction(sl); }
    })
  );
  document.getElementById('flt-search')?.addEventListener('input', e => {
    S.filter.search = e.target.value;
    document.getElementById('tab-content').innerHTML = renderInventoryHTML();
    bindTab();
  });
  document.getElementById('flt-organ')?.addEventListener('change', e => {
    S.filter.organ = e.target.value;
    document.getElementById('tab-content').innerHTML = renderInventoryHTML();
    bindTab();
  });
  document.getElementById('flt-status')?.addEventListener('change', e => {
    S.filter.status = e.target.value;
    document.getElementById('tab-content').innerHTML = renderInventoryHTML();
    bindTab();
  });
  document.getElementById('btn-add-exp')?.addEventListener('click', modalAddExp);
  document.getElementById('btn-add-batch')?.addEventListener('click', modalAddBatch);
}

// ── Boot ──────────────────────────────────────────────────────────────────
if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);
render();
// Pre-init token client once GIS script loads
window.addEventListener('load', () => { if (window.google) initTokenClient(); });
