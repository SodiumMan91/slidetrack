<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Access Denied — SlideTrack</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#fff;--border:#e4e2db;
  --text:#1a1917;--text2:#5c5a57;--text3:#9a9895;
  --red:#b83232;--red-bg:#fdf0f0;--red-border:#f0a8a8;
  --accent:#3b5bdb;
  --radius-lg:12px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#141413;--surface:#1e1e1c;--border:#2e2e2b;
    --text:#f0ede8;--text2:#a0a09a;--text3:#666660;
    --red:#f07070;--red-bg:#2a0f0f;--red-border:#4a1a1a;
    --accent:#7b97f5;
  }
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.25rem;max-width:440px;width:100%;text-align:center}
.icon{width:52px;height:52px;border-radius:50%;background:var(--red-bg);border:1.5px solid var(--red-border);display:flex;align-items:center;justify-content:center;margin:0 auto 1.1rem}
.icon svg{width:26px;height:26px;color:var(--red)}
h1{font-size:19px;font-weight:700;margin-bottom:.6rem}
p{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:.9rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;text-decoration:none;margin-top:.5rem}
.btn:hover{opacity:.88}
.back{display:block;margin-top:1.4rem;font-size:12px;color:var(--text3);text-decoration:none}
.back:hover{color:var(--text2)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">

</div>
